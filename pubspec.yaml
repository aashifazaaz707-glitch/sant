name: santacademy
description: "A student-focused platform for Bihar Board & CBSE students in Madhepur, Madhubani."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # State Management & Routing
  provider: ^6.1.2
  go_router: ^14.0.0
  
  # Database & Backend Integration
  supabase_flutter: ^2.6.0
  
  # UI Styles & Visuals
  google_fonts: ^6.1.0
  lucide_icons_flutter: ^2.0.6
  
  # PDF study materials viewer (Cross-platform Web & Mobile support)
  syncfusion_flutter_pdfviewer: ^24.2.7
  
  # Performance Analytics Charts (in Profile Section)
  fl_chart: ^0.66.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
